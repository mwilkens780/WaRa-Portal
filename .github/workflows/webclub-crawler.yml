name: WebClub Crawler

on:
  schedule:
    # Täglich um 03:00 UTC (05:00 CEST / 04:00 CET)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Manuell auslösbar über GitHub → Actions → "Run workflow"
    # lookback_days: leer lassen für Standard (90), oder z.B. 1825 für 5 Jahre historische Daten
    inputs:
      lookback_days:
        description: 'Wie viele Tage in die Vergangenheit (Standard: 90, für Historien-Import z.B. 1825)'
        required: false
        default: '90'
        type: string

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Playwright-Browser-Cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Playwright installieren
        run: |
          npm install playwright
          npx playwright install chromium
          # System-Abhängigkeiten separat mit Timeout (apt-get kann bei Mirror-Ausfällen hängen)
          timeout 180 npx playwright install-deps chromium || echo "WARN: install-deps fehlgeschlagen (ggf. bereits vorhanden)"

      - name: Crawler-Config erstellen
        env:
          WEBCLUB_BASE_URL: ${{ secrets.WEBCLUB_BASE_URL }}
          WEBCLUB_USERNAME: ${{ secrets.WEBCLUB_USERNAME }}
          WEBCLUB_PASSWORD: ${{ secrets.WEBCLUB_PASSWORD }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '90' }}
        run: |
          jq -n \
            --arg base_url      "$WEBCLUB_BASE_URL" \
            --arg username      "$WEBCLUB_USERNAME" \
            --arg password      "$WEBCLUB_PASSWORD" \
            --argjson lookback  "${LOOKBACK_DAYS}" \
            '{
              base_url:              $base_url,
              username:              $username,
              password:              $password,
              lookback_days:         $lookback,
              lookahead_days:        365,
              scrape_competitions:   true,
              scrape_persons:        true,
              headless:              true,
              timeout_ms:            20000,
              screenshot_on_error:   "/tmp/webclub-screenshot"
            }' > /tmp/webclub-config.json

      - name: Crawler ausführen
        run: |
          node scripts/webclub-crawler.js /tmp/webclub-config.json > /tmp/webclub-output.json
          echo "Crawler-Output Größe: $(wc -c < /tmp/webclub-output.json) Bytes"

      - name: Debug-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webclub-debug-screenshots
          path: /tmp/webclub-screenshot_*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Ergebnisse ans Portal senden
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          WEBCLUB_IMPORT_TOKEN: ${{ secrets.WEBCLUB_IMPORT_TOKEN }}
        run: |
          # Trailing Slash entfernen, falls vorhanden
          BASE="${PORTAL_URL%/}"
          IMPORT_URL="${BASE}/api/webclub-import"

          echo "Sende an: ${IMPORT_URL}"

          HTTP_STATUS=$(curl -s -o /tmp/portal-response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WEBCLUB_IMPORT_TOKEN" \
            --data @/tmp/webclub-output.json \
            --max-time 180 \
            "$IMPORT_URL")

          echo "Portal-Antwort (HTTP $HTTP_STATUS):"
          cat /tmp/portal-response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Fehler: Portal hat HTTP $HTTP_STATUS geantwortet."
            exit 1
          fi
